server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /yuanji {
        return 301 /yuanji/;
    }

    location /yuanji/api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        rewrite ^/yuanji(/api/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /yuanji;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location /yuanji/assets/ {
        rewrite ^/yuanji(/assets/.*)$ $1 break;
        try_files $uri =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location = /yuanji/favicon.svg {
        rewrite ^/yuanji(/favicon.svg)$ $1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /yuanji/ {
        rewrite ^/yuanji/.*$ /index.html break;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
